name: Treasure Hunt Checker Tests
on:
  push:
    branches: [feature/treasure-hunt-letter-checker]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node treasure-hunt-test.mjs
